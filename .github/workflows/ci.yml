name: CI - pruebas en cada pull request

on:
  pull_request:
    branches: [main]

jobs:
  build-y-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas unitarias
        run: pytest -v tests/test_features.py tests/test_limpieza.py

  test-de-datos:
    name: Test de Datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Calidad y esquema de los datos
        run: pytest -v tests/test_datos.py
